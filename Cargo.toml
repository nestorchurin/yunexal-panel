[package]
name = "yunexal-panel"
version = "0.5.1"
edition = "2021"
default-run = "yunexal-panel"

[[bin]]
name = "yunexal-panel"
path = "src/main.rs"

[[bin]]
name = "yunexal-setup"
path = "src/bin/setup.rs"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
axum = { version = "0.8.9", features = ["ws", "multipart"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "tls-rustls"] }
bollard = "0.21.0"
askama = "0.16.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"    
anyhow = "1.0.102"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
dotenvy = "0.15.7"
serde_yaml = "0.9.34+deprecated"
rand = "0.10.1"
base64 = "0.22.1"
futures-util = "0.3.32"
dashmap = "6.2.1"
html-escape = "0.2.13"
urlencoding = "2.1.3"
axum-extra = { version = "0.12.6", features = ["cookie-private"] }
time = { version = "0.3.47", features = ["std"] }
tower-http = { version = "0.6.11", features = ["fs"] }
argon2 = { version = "0.5.3", features = ["std"] }
rust-embed = { version = "8.11.0", features = ["include-exclude"] }
axum-embed = "0.1.0"
reqwest = { version = "0.13.3", features = ["json"] }
flate2 = "1.1.9"
tar = "0.4.46"
rpassword = "7.5.3"
aes-gcm = "0.10.3"
sha2 = "0.11.0"
