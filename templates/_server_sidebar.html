<div class="yu-sb-overlay" id="sbOverlay" onclick="closeSidebar()"></div>
<aside class="yu-sidebar" id="sidebar">
    <a href="/" class="sb-back"><i class="bi bi-arrow-left"></i> Dashboard</a>
    <div class="sb-brand"><span class="dot"></span>Yunexal Panel</div>
    <div class="sb-server">
        <div class="sb-server-name">{{ container.name }}</div>
        <span id="server-status-badge" class="sb-status
            {% if container.state == "running" %}sb-running
            {% else if container.state == "restarting" %}sb-other
            {% else %}sb-stopped{% endif %}">
            <span class="sb-dot"></span><span id="status-text">{{ container.state }}</span>
        </span>
    </div>
    <div class="yu-sidebar-top">
        <div class="yu-nav-label">Server</div>
        <a href="/servers/{{id}}/console" class="yu-nav-item{% if active_tab == "console" %} active{% endif %}" onclick="if (typeof serverSwitchTab === 'function') { serverSwitchTab('/servers/{{id}}/console', this); return false; }"><i class="bi bi-terminal-fill"></i> Console</a>
        <a href="/servers/{{id}}/files" class="yu-nav-item{% if active_tab == "files" %} active{% endif %}" onclick="if (typeof serverSwitchTab === 'function') { serverSwitchTab('/servers/{{id}}/files', this); return false; }"><i class="bi bi-folder2-open"></i> Files</a>
        <a href="/servers/{{id}}/backups" class="yu-nav-item{% if active_tab == "backups" %} active{% endif %}" onclick="if (typeof serverSwitchTab === 'function') { serverSwitchTab('/servers/{{id}}/backups', this); return false; }"><i class="bi bi-archive"></i> Backups</a>
        <a href="/servers/{{id}}/networking" class="yu-nav-item{% if active_tab == "networking" %} active{% endif %}" onclick="if (typeof serverSwitchTab === 'function') { serverSwitchTab('/servers/{{id}}/networking', this); return false; }"><i class="bi bi-diagram-3"></i> Networking</a>
        {% if can_members %}
        <a href="/servers/{{id}}/users" class="yu-nav-item{% if active_tab == "users" %} active{% endif %}" onclick="if (typeof serverSwitchTab === 'function') { serverSwitchTab('/servers/{{id}}/users', this); return false; }"><i class="bi bi-people"></i> Users</a>
        {% endif %}
        <a href="/servers/{{id}}/audit" class="yu-nav-item{% if active_tab == "audit" %} active{% endif %}" onclick="if (typeof serverSwitchTab === 'function') { serverSwitchTab('/servers/{{id}}/audit', this); return false; }"><i class="bi bi-clock-history"></i> Audit</a>
        <a href="/servers/{{id}}/schedules" class="yu-nav-item{% if active_tab == "schedules" %} active{% endif %}" onclick="if (typeof serverSwitchTab === 'function') { serverSwitchTab('/servers/{{id}}/schedules', this); return false; }"><i class="bi bi-calendar-event"></i> Schedules</a>
        <a href="/servers/{{id}}/settings" class="yu-nav-item{% if active_tab == "settings" %} active{% endif %}" onclick="if (typeof serverSwitchTab === 'function') { serverSwitchTab('/servers/{{id}}/settings', this); return false; }"><i class="bi bi-gear"></i> Settings</a>
    </div>
</aside>
